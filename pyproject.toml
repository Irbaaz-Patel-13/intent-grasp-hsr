[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-grasp"
version = "1.0.0"
description = "Intent-driven, part-aware grasping on the Toyota HSR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Irbaaz Ahmed Patel" }]

[tool.setuptools]
packages = ["intent_grasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
